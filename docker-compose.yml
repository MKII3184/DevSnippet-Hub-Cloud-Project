services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ten-nhom/devsnippet-hub:v1.0
    container_name: devsnippet-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=change-this-jwt-secret-in-production-2026
      - DATABASE_URL=postgres://postgres:postgres_secure_pass@db:5432/devsnippet_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devsnippet-net

  db:
    image: postgres:16-alpine
    container_name: devsnippet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=devsnippet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devsnippet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devsnippet-net

volumes:
  postgres_data:
    driver: local

networks:
  devsnippet-net:
    driver: bridge
